{% extends 'events/base.html' %}

{% block title %}Create Discount{% endblock %}

{% block content %}
<h2>Create Discount for {{ event.title }}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create Discount</button>
</form>

<p><a href="{% url 'event_detail' event.id %}">Back to Event</a></p>
{% endblock %}
