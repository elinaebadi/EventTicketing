<h1>Create New Event</h1>

{% if messages %}
    {% for message in messages %}
        <p style="color:green;">{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create Event</button>
</form>

<a href="{% url 'event_list' %}">Back to Event List</a>
