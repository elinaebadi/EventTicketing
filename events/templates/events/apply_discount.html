<h1>Apply Discount for {{ event.title }}</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Apply</button>
</form>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

{% if discount %}
    <p>Discount applied: {{ discount }}%</p>
    <p>Final price: {{ final_price }}</p>
{% endif %}
