{% extends 'events/base.html' %}

{% block title %}Event List{% endblock %}

{% block content %}
<h2>Event List</h2>

{% if events %}
    <ul>
        {% for event in events %}
            <li>
                <a href="{% url 'event_detail' event.id %}">
                    {{ event.title }} — {{ event.date }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No events available.</p>
{% endif %}
{% endblock %}
