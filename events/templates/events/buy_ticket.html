{% extends 'events/base.html' %}

{% block title %}Buy Ticket{% endblock %}

{% block content %}
<h2>Buy Ticket for {{ event.title }}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    {% if final_price %}
        <p><strong>Final Price:</strong> {{ final_price }}</p>
    {% endif %}

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <button type="submit">Complete Purchase</button>
</form>

<p><a href="{% url 'event_detail' event.id %}">Back</a></p>
{% endblock %}
